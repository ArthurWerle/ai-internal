services:
  app:
    container_name: ai-internal
    build: .
    env_file:
      - stack.env
    environment:
      # The app builds its own DATABASE_URL from the POSTGRES_* vars injected via
      # env_file; only the host needs pointing at the compose network (the
      # `postgres` service name), not the host-published port.
      POSTGRES_HOST: postgres
    ports:
      - "3005:3005"
    labels:
      prometheus.io/scrape: "true"
      prometheus.io/hostport: "3005"
      prometheus.io/path: "/metrics"
      environment: "production"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ai-internal-network
      - financer-transactions_transactions-network
      - bff_back-end
  postgres:
    image: postgres:16-alpine
    container_name: ai-internal-postgres
    env_file:
      - stack.env
    # Without a restart policy, an exit (code 255 / OOM / host reboot) left the
    # DB down until a manual restart, while the app crash-looped against it.
    restart: unless-stopped
    # Give postgres time to fast-shutdown cleanly before Docker sends SIGKILL,
    # which is what leaves the "database was not properly shut down" recovery.
    stop_grace_period: 60s
    # Default /dev/shm is 64MB; too small can crash with "could not resize
    # shared memory segment".
    shm_size: 256mb
    ports:
      - 5439:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - ai-internal-network
volumes:
  postgres_data:

networks:
  ai-internal-network:
    driver: bridge
  financer-transactions_transactions-network:
    external: true
  bff_back-end:
    external: true